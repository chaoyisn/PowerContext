# Dify × OceanBase — 《记仇小镇：NPC 的复仇日记》部署编排
#
# 这是一个 **精简版** Dify 1.8.0 编排，只包含本赛题真正需要的服务：
#   api / worker / worker_beat / db / redis / sandbox / plugin_daemon / ssrf_proxy
#   + town-backend（游戏后端）
#
# 与官方 compose 的差异（以及原因）：
#   1. 不启动 nginx / web 前端。本赛题的验收入口是 Dify 的 **Service API**
#      （/v1/chat-messages 等），命令行脚本即可驱动，不需要浏览器控制台。
#   2. 不启动任何向量数据库。本赛题的记忆由 PowerContext 承担，不依赖
#      Dify 的 Knowledge Retrieval。
#   3. ssrf_proxy 挂载了额外的 conf.d 允许清单，让 HTTP Request 节点
#      能访问游戏后端（见 ssrf_proxy/allow-town-backend.conf）。
#      官方模板最后一行是 `http_access deny all`，默认拒绝一切出网请求。
#
# 启动：
#   cd dify/deploy
#   cp .env.example .env        # 按需修改
#   docker compose -f docker-compose.yaml up -d
#
# 停止与清理：
#   docker compose -f docker-compose.yaml down
#   docker compose -f docker-compose.yaml down -v   # 连同数据卷一起删除

name: memory-town

x-shared-env: &shared-api-worker-env
  CONSOLE_API_URL: ${CONSOLE_API_URL:-}
  CONSOLE_WEB_URL: ${CONSOLE_WEB_URL:-}
