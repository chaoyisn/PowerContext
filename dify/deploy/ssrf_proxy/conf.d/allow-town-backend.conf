# 《记仇小镇》SSRF 代理允许清单
#
# Dify 官方 squid 模板（squid.conf.template）的最后一行是 `http_access deny all`，
# 也就是说 HTTP Request 节点**无法**访问游戏后端。本文件被模板中的
# `include /etc/squid/conf.d/*.conf` 引入，放行两类目标：
#
#   1. town-backend   —— 本赛题的游戏后端（HTTP Request 节点读写游戏状态）
#   2. 宿主机上的模型代理 —— Dify 的 Anthropic 模型插件走 http_request，
#      插件进程本身不经 squid，但若插件运行在同网络命名空间里也会用到。
#
# 注意：squid 的 http_access 是**顺序匹配、首个命中即生效**。
# 模板里的 `include` 位于 `http_access deny all` 之前，
# 因此本文件中的放行规则优先生效，其后的 `deny all` 兜底其余目标。
#
# 安全边界：只放行游戏后端所在容器网段与宿主机网关，
# 不放行整个 172.16/12 私网，也不放行任意互联网地址。

# ---------------------------------------------------------------- 目标定义
# 游戏后端容器名（compose 中的服务名）。
acl town_backend dstdomain town-backend
acl town_backend_host dst 172.16.0.0/12

# 宿主机网关（host.docker.internal 在 Docker Desktop 上解析到网关地址），
# 用于访问跑在宿主机上的模型代理 / PowerContext。
acl host_gateway dst 172.17.0.0/16
acl host_gateway dst 192.168.0.0/16

# 允许访问的端口：游戏后端 8848、模型代理 15721、PowerContext 8800。
acl town_ports port 8848
acl model_ports port 15721
acl powercontext_ports port 8800

# ---------------------------------------------------------------- 放行规则
http_access allow town_backend town_ports
http_access allow town_backend_host town_ports
http_access allow host_gateway model_ports
http_access allow host_gateway powercontext_ports
