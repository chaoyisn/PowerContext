      positionAbsolute:
        x: 2120
        y: 300
      width: 114
      height: 116
      sourcePosition: right
      targetPosition: left
      data:
        type: code
        title: 汇总动作结果
        desc: 把后端判定结果整理成给 LLM 的事实；拒绝绝不报成功
        code_language: python3
        variables:
        - variable: action_body
          value_selector:
          - http_action
          - body
        - variable: action_code
          value_selector:
          - http_action
          - status_code
        - variable: query_text
