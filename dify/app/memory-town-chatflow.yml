          - comparison_operator: is
            value: 'true'
            variable_selector:
            - code_verdict
            - verdict_committed
        - case_id: case_idle
          logical_operator: and
          conditions:
          - comparison_operator: is
            value: 'true'
            variable_selector:
            - code_input
            - input_ok
          - comparison_operator: is
            value: 'true'
            variable_selector:
            - code_state
            - state_ok
    - id: http_action
      type: custom
      position:
        x: 1930
