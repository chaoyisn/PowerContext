[project]
name = "researchflow-backend"
version = "0.1.0"
description = "ResearchFlow backend: evidence-backed research knowledge base (seekdb) + long-term task memory (PowerContext)"
requires-python = ">=3.11"
dependencies = [
    # --- retrieval backend: official seekdb SDK (remote server mode) ---
    "pyseekdb==1.4.0.post1",
    # --- long-term task memory ---
    "powercontext[client]==1.4.1",
    # --- api ---
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.20",
    "pydantic==2.13.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    # --- document parsing ---
    "pymupdf==1.27.2.2",
    # --- llm (OpenAI-compatible) ---
    "openai==2.32.0",
    # --- embeddings ---
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
